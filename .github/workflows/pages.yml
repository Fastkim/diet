name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify application
        run: node --test tests
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R css js _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          if find _site -type l | grep -q .; then
            echo 'Public assets must not contain symbolic links.'
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
